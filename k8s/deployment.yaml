apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: roankessels/codesnap-api-gateway:693977630cbeeb1fb1b23521466c55cef3c0fb92

          imagePullPolicy: Always

          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: NATS_URL
              # 3. Use internal K8s DNS (standard for microservices)
              value: "nats://nats:4222"
            - name: LOGFIRE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logfire-secrets
                  key: write-token
            - name: LOGFIRE_SERVICE_NAME
              value: "api-gateway"
            - name: KEYCLOAK_URL
              # Use internal K8s DNS for Keycloak (with /auth path for legacy Keycloak)
              value: "http://keycloak:8080/auth"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
